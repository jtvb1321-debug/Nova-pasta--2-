<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo da tela de login: rede de fibra ao entardecer (postes, cabos e cidade). -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060708"/>
      <stop offset="0.45" stop-color="#121014"/>
      <stop offset="0.72" stop-color="#2a170c"/>
      <stop offset="0.86" stop-color="#6a2c08"/>
      <stop offset="1" stop-color="#140b06"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.66" cy="0.84" r="0.42">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#ff5a00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0b0a"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="fibra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff8a2a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </linearGradient>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="janelas" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="4" height="6" fill="#ffb15c" fill-opacity="0.22"/>
      <rect x="11" y="13" width="4" height="6" fill="#ffd29a" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#ceu)"/>
  <rect width="1920" height="1080" fill="url(#sol)"/>

  <!-- Grade discreta no ceu (rede) -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <path d="M0 160H1920M0 320H1920M0 480H1920M0 640H1920"/>
    <path d="M240 0V760M480 0V760M720 0V760M960 0V760M1200 0V760M1440 0V760M1680 0V760"/>
  </g>

  <!-- Cidade ao fundo -->
  <g fill="#0f0f12">
    <path d="M0 860V760h70v-40h60v60h50V700h90v80h40V740h70v-70h40v-40h50v40h40v120h60V720h80v60h50V680h30v-30h60v30h30v130h70V730h90v70h50V700h40v-50h70v50h40v110h60V740h80v60h40V690h100v130h50V720h80v80h60V710h40v-60h50v60h40v100h70V740h60v60h50V680h90v130h40V760h60v100z"/>
  </g>
  <g fill="url(#janelas)">
    <rect x="180" y="700" width="90" height="140"/>
    <rect x="500" y="635" width="50" height="200"/>
    <rect x="800" y="650" width="60" height="180"/>
    <rect x="1100" y="650" width="70" height="170"/>
    <rect x="1330" y="690" width="100" height="140"/>
    <rect x="1590" y="650" width="50" height="180"/>
  </g>

  <!-- Chao -->
  <path d="M0 850Q960 820 1920 850V1080H0z" fill="url(#chao)"/>

  <!-- Cabos entre os postes (fibra) -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 452Q230 540 470 470T980 420T1480 470T2000 440" stroke="#1b1b1f" stroke-width="3"/>
    <path d="M-40 480Q230 572 470 500T980 452T1480 502T2000 470" stroke="#1b1b1f" stroke-width="2.5"/>
    <path d="M-40 520Q230 610 470 540T980 492T1480 540T2000 512" stroke="#19191c" stroke-width="2"/>
    <path d="M-40 452Q230 540 470 470T980 420T1480 470T2000 440" stroke="url(#fibra)" stroke-width="1.6"/>
    <path d="M-40 520Q230 610 470 540T980 492T1480 540T2000 512" stroke="url(#fibra)" stroke-width="1.2" stroke-opacity="0.7"/>
  </g>

  <!-- Pulsos de dados nos cabos -->
  <g fill="#ffa24d" filter="url(#brilho)">
    <circle cx="300" cy="512" r="6"/>
    <circle cx="760" cy="440" r="5"/>
    <circle cx="1210" cy="452" r="6"/>
    <circle cx="1700" cy="458" r="5"/>
    <circle cx="610" cy="520" r="4"/>
    <circle cx="1360" cy="522" r="4"/>
  </g>
  <g fill="#ffd6ad">
    <circle cx="300" cy="512" r="2.2"/>
    <circle cx="760" cy="440" r="2"/>
    <circle cx="1210" cy="452" r="2.2"/>
    <circle cx="1700" cy="458" r="2"/>
    <circle cx="610" cy="520" r="1.6"/>
    <circle cx="1360" cy="522" r="1.6"/>
  </g>

  <!-- Postes (silhuetas), com cruzeta e caixa de emenda -->
  <g fill="#08080a">
    <!-- poste 1 -->
    <rect x="462" y="400" width="16" height="520"/>
    <rect x="410" y="452" width="120" height="10" rx="2"/>
    <rect x="426" y="500" width="88" height="8" rx="2"/>
    <rect x="478" y="560" width="30" height="46" rx="4"/>
    <!-- poste 2 -->
    <rect x="972" y="352" width="18" height="560"/>
    <rect x="912" y="404" width="138" height="11" rx="2"/>
    <rect x="930" y="454" width="102" height="9" rx="2"/>
    <rect x="990" y="520" width="34" height="52" rx="4"/>
    <!-- poste 3 -->
    <rect x="1472" y="404" width="16" height="520"/>
    <rect x="1420" y="456" width="120" height="10" rx="2"/>
    <rect x="1436" y="504" width="88" height="8" rx="2"/>
    <rect x="1446" y="566" width="28" height="44" rx="4"/>
  </g>
  <!-- LEDs das caixas -->
  <g fill="#ff7a00">
    <circle cx="493" cy="572" r="2.4"/>
    <circle cx="1007" cy="534" r="2.6"/>
    <circle cx="1460" cy="578" r="2.4"/>
  </g>
  <g fill="#ff7a00" filter="url(#brilho)" opacity="0.8">
    <circle cx="493" cy="572" r="6"/>
    <circle cx="1007" cy="534" r="7"/>
    <circle cx="1460" cy="578" r="6"/>
  </g>

  <!-- Poste em primeiro plano, a direita -->
  <g fill="#050506">
    <rect x="1812" y="180" width="34" height="900"/>
    <rect x="1700" y="250" width="250" height="16" rx="3"/>
    <rect x="1730" y="320" width="190" height="13" rx="3"/>
  </g>
  <path d="M1829 258Q1500 330 1190 300" fill="none" stroke="#0b0b0d" stroke-width="5"/>
  <path d="M1829 326Q1540 410 1210 380" fill="none" stroke="#0b0b0d" stroke-width="4"/>
</svg>
